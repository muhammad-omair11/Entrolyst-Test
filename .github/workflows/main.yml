name: CI/CD for Frontend
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  # -----------------------------------------------------------------
  # 1. Build — build the image with Docker, tagged by commit SHA
  # -----------------------------------------------------------------
  build:
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      env: ${{ steps.vars.outputs.env }}
      owner: ${{ steps.vars.outputs.owner }}
      local_tag: ${{ steps.vars.outputs.local_tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set environment info
        id: vars
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          SHA="${GITHUB_SHA::7}"
          TAG="${ENV}-${SHA}"
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/frontend:${TAG}"
          LOCAL_TAG="local/frontend:${SHA}"
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "local_tag=$LOCAL_TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with Docker (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.vars.outputs.local_tag }}

  # -----------------------------------------------------------------
  # 2. Encrypt — hand Docker image to nerdctl, encrypt, push to GHCR
  # -----------------------------------------------------------------
  encrypt:
    needs: build
    runs-on: self-hosted
    environment: ${{ needs.build.outputs.env }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Save Docker image and load into nerdctl
        env:
          LOCAL_TAG: ${{ needs.build.outputs.local_tag }}
        run: |
          docker save "$LOCAL_TAG" -o /tmp/frontend-build.tar
          sudo nerdctl load -i /tmp/frontend-build.tar
          sudo rm -f /tmp/frontend-build.tar

      - name: Check secret is populated
        env:
          SECRET: ${{ secrets.ENC_PUBLIC_KEY }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "❌ ENC_PUBLIC_KEY is EMPTY or not accessible to this job"
            exit 1
          fi

      - name: Write public key
        run: |
          printf '%s' "${{ secrets.ENC_PUBLIC_KEY }}" | base64 -d > pubkey.pem
          head -1 pubkey.pem

      - name: Encrypt image with nerdctl
        run: |
          sudo nerdctl image encrypt \
            --recipient=jwe:pubkey.pem \
            ${{ needs.build.outputs.local_tag }} \
            ${{ needs.build.outputs.image }}

          sudo nerdctl image encrypt \
            --recipient=jwe:pubkey.pem \
            ${{ needs.build.outputs.local_tag }} \
            ghcr.io/${{ needs.build.outputs.owner }}/frontend:${{ needs.build.outputs.env }}-latest

      - name: Log in to GHCR (nerdctl)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo nerdctl login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push encrypted image
        run: |
          sudo nerdctl push ${{ needs.build.outputs.image }}
          sudo nerdctl push ghcr.io/${{ needs.build.outputs.owner }}/frontend:${{ needs.build.outputs.env }}-latest

      - name: Clean up key
        if: always()
        run: rm -f pubkey.pem

  # -----------------------------------------------------------------
  # 3. Deploy — nerdctl pulls + decrypts, hands back to Docker to run
  # -----------------------------------------------------------------
  deploy:
    needs: [build, encrypt]
    runs-on: self-hosted
    environment: ${{ needs.build.outputs.env }}
    steps:
      - name: Log in to GHCR (nerdctl)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo nerdctl login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and decrypt with nerdctl
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          PRIVATE_KEY: /etc/imgcrypt/frontend_private.pem
        run: |
          # Pull encrypted image WITHOUT unpacking (still ciphertext)
          sudo nerdctl pull --unpack=false "$IMAGE"

          # Decrypt into a local plaintext image tag
          sudo nerdctl image decrypt \
            --key="$PRIVATE_KEY" \
            "$IMAGE" \
            "${IMAGE}-decrypted"

      - name: Hand decrypted image back to Docker
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          sudo nerdctl save "${IMAGE}-decrypted" -o /tmp/frontend-decrypted.tar
          sudo docker load -i /tmp/frontend-decrypted.tar
          sudo rm -f /tmp/frontend-decrypted.tar

      - name: Run container with Docker
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TARGET_PORT: ${{ secrets.VM_PORT }}
          CONTAINER_NAME: "frontend-${{ needs.build.outputs.env }}"
        run: |
          sudo docker stop "$CONTAINER_NAME" || true
          sudo docker rm "$CONTAINER_NAME" || true

          sudo docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$TARGET_PORT:80" \
            "${IMAGE}-decrypted"

      - name: Deployment summary
        run: echo "✅ Deployed ${{ needs.build.outputs.image }} (sha ${{ needs.build.outputs.sha }}) to ${{ needs.build.outputs.env }} via Docker"
