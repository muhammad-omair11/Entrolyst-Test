name: CI/CD for Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write
    steps:
      # -----------------------------------------------------------------
      # 1. Get the code
      # -----------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2. Work out env name + image tag
      # -----------------------------------------------------------------
      - name: Set environment info
        id: vars
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          TAG="${ENV}-${GITHUB_SHA::7}"
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "Deploying environment: $ENV  |  image tag: $TAG"

      # -----------------------------------------------------------------
      # 3. Log in to GitHub Container Registry (same account, both envs)
      # -----------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------
      # 4. Build & push the image (CI)
      # -----------------------------------------------------------------
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/frontend:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/frontend:${{ steps.vars.outputs.env }}-latest

      # -----------------------------------------------------------------
      # 5. Deploy locally — runner lives on the same VM, no SSH needed
      # -----------------------------------------------------------------
      - name: Deploy on this VM
        env:
          IMAGE: ghcr.io/${{ steps.vars.outputs.owner }}/frontend:${{ steps.vars.outputs.tag }}
          TARGET_PORT: ${{ secrets.VM_PORT }}
          CONTAINER_NAME: "frontend-${{ steps.vars.outputs.env }}"
        run: |
          docker pull $IMAGE
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true
          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p $TARGET_PORT:80 \
            $IMAGE

      - name: Deployment summary
        run: |
          echo "✅ Deployed ${{ steps.vars.outputs.tag }} to ${{ steps.vars.outputs.env }}"
