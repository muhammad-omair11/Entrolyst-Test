name: CI/CD for Frontend
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  # -----------------------------------------------------------------
  # 1. Build — build image locally, encrypt it, push encrypted to GHCR
  # -----------------------------------------------------------------
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      env: ${{ steps.vars.outputs.env }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set environment info
        id: vars
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          TAG="${ENV}-${GITHUB_SHA::7}"
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/frontend:${TAG}"
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Deploying environment: $ENV | image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: local/frontend:build

      - name: Write public key
        run: echo "${{ secrets.ENC_PUBLIC_KEY }}" > pubkey.pem

      - name: Log in to GHCR (skopeo)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Encrypt and push image
        run: |
          skopeo copy \
            --encryption-key jwe:pubkey.pem \
            docker-daemon:local/frontend:build \
            docker://${{ steps.vars.outputs.image }}

          skopeo copy \
            --encryption-key jwe:pubkey.pem \
            docker-daemon:local/frontend:build \
            docker://ghcr.io/${{ steps.vars.outputs.owner }}/frontend:${{ steps.vars.outputs.env }}-latest

      - name: Clean up key
        if: always()
        run: rm -f pubkey.pem

  # -----------------------------------------------------------------
  # 2. Deploy — pull encrypted image, decrypt with private key, run
  # -----------------------------------------------------------------
  deploy:
    needs: build
    runs-on: self-hosted
    environment: ${{ needs.build.outputs.env }}
    steps:
      - name: Log in to GHCR (nerdctl)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo nerdctl login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy on this VM
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TARGET_PORT: ${{ secrets.VM_PORT }}
          CONTAINER_NAME: "frontend-${{ needs.build.outputs.env }}"
          PRIVATE_KEY: /etc/imgcrypt/frontend_private.pem
        run: |
          # Pull the encrypted image (stored encrypted, not runnable yet)
          sudo nerdctl pull "$IMAGE"

          # Decrypt into a local plaintext image tag
          sudo nerdctl image decrypt \
            --key="$PRIVATE_KEY" \
            "$IMAGE" \
            "${IMAGE}-decrypted"

          sudo nerdctl stop "$CONTAINER_NAME" || true
          sudo nerdctl rm "$CONTAINER_NAME" || true

          sudo nerdctl run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$TARGET_PORT:80" \
            "${IMAGE}-decrypted"

      - name: Deployment summary
        run: echo "✅ Deployed ${{ needs.build.outputs.image }} to ${{ needs.build.outputs.env }}"
