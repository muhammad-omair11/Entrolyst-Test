name: CI/CD for Frontend
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  # -----------------------------------------------------------------
  # 1. Build — build + encrypt with nerdctl, push encrypted to GHCR
  # -----------------------------------------------------------------
  build:
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      env: ${{ steps.vars.outputs.env }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set environment info
        id: vars
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          TAG="${ENV}-${GITHUB_SHA::7}"
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/frontend:${TAG}"
          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build image with nerdctl
        run: |
          sudo nerdctl build -t local/frontend:build .

      - name: Check secret is populated
        env:
          SECRET: ${{ secrets.ENC_PUBLIC_KEY }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "❌ ENC_PUBLIC_KEY is EMPTY or not accessible to this job"
            exit 1
          fi

      - name: Write public key
        run: |
          printf '%s' "${{ secrets.ENC_PUBLIC_KEY }}" | base64 -d > pubkey.pem
          head -1 pubkey.pem

      - name: Encrypt image with nerdctl
        run: |
          sudo nerdctl image encrypt \
            --recipient=jwe:pubkey.pem \
            local/frontend:build \
            ${{ steps.vars.outputs.image }}

          sudo nerdctl image encrypt \
            --recipient=jwe:pubkey.pem \
            local/frontend:build \
            ghcr.io/${{ steps.vars.outputs.owner }}/frontend:${{ steps.vars.outputs.env }}-latest

      - name: Log in to GHCR (nerdctl)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo nerdctl login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push encrypted image
        run: |
          sudo nerdctl push ${{ steps.vars.outputs.image }}
          sudo nerdctl push ghcr.io/${{ steps.vars.outputs.owner }}/frontend:${{ steps.vars.outputs.env }}-latest

      - name: Clean up key
        if: always()
        run: rm -f pubkey.pem

  # -----------------------------------------------------------------
  # 2. Deploy — pull+decrypt with nerdctl, run with docker
  # -----------------------------------------------------------------
  deploy:
    needs: build
    runs-on: self-hosted
    environment: ${{ needs.build.outputs.env }}
    steps:
      - name: Log in to GHCR (nerdctl)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo nerdctl login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and decrypt with nerdctl
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          PRIVATE_KEY: /etc/imgcrypt/frontend_private.pem
        run: |
          # Pull encrypted image WITHOUT unpacking (still ciphertext)
          sudo nerdctl pull --unpack=false "$IMAGE"

          # Decrypt into a local plaintext image tag
          sudo nerdctl image decrypt \
            --key="$PRIVATE_KEY" \
            "$IMAGE" \
            "${IMAGE}-decrypted"

      - name: Hand off decrypted image to Docker
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          sudo nerdctl save "${IMAGE}-decrypted" -o /tmp/frontend-decrypted.tar
          sudo docker load -i /tmp/frontend-decrypted.tar
          sudo rm -f /tmp/frontend-decrypted.tar

      - name: Run container with Docker
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TARGET_PORT: ${{ secrets.VM_PORT }}
          CONTAINER_NAME: "frontend-${{ needs.build.outputs.env }}"
        run: |
          sudo docker stop "$CONTAINER_NAME" || true
          sudo docker rm "$CONTAINER_NAME" || true

          sudo docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$TARGET_PORT:80" \
            "${IMAGE}-decrypted"

      - name: Deployment summary
        run: echo "✅ Deployed ${{ needs.build.outputs.image }} to ${{ needs.build.outputs.env }} via Docker"
