server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression - smaller payloads, faster loads
    gzip on;
    gzip_types text/css application/javascript text/html application/json image/svg+xml;
    gzip_min_length 256;

    # Cache static assets aggressively (CSS/JS/images rarely change per deploy,
    # and each deploy ships a new image anyway)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fallback so client-side routes (if you add JS routing later) don't 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Don't leak nginx version in error pages / headers
    server_tokens off;

    error_page 404 /index.html;
}
