<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Contact | Wanderlust
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="navbar">

    <a class="logo" href="index.html">
        🏔️ Wanderlust
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="about.html">
            About
        </a>

        <a href="destinations.html">
            Destinations
        </a>

        <a href="gallery.html">
            Gallery
        </a>

        <a href="blog.html">
            Blog
        </a>

        <a
            class="active"
            href="contact.html"
        >
            Contact
        </a>

    </nav>


    <a
        class="btn small"
        href="contact.html"
    >
        Plan a Trip
    </a>

</header>


<section class="page-hero">

    <h1>
        Contact Us
    </h1>

    <p>
        Let's start planning your next adventure.
    </p>

</section>


<section class="container section split">


    <div>

        <p class="eyebrow">
            GET IN TOUCH
        </p>

        <h2>
            Have a question?
        </h2>

        <p>
            📧 Email:
            hello@gmail.com
        </p>

        <p>
            📞 Phone:
            03189908865
        </p>

        <p>
            📍 Location:
            Adventure City
        </p>

    </div>


    <form class="card">

        <label>

            Name

            <input
                type="text"
                required
                placeholder="Your name"
            >

        </label>


        <label>

            Email

            <input
                type="email"
                required
                placeholder="Your email"
            >

        </label>


        <label>

            Subject

            <input
                type="text"
                placeholder="Trip subject"
            >

        </label>


        <label>

            Message

            <textarea
                rows="5"
                placeholder="Tell us about your trip"
            ></textarea>

        </label>


        <button
            class="btn"
            type="submit"
        >
            Send Message
        </button>

    </form>


</section>


<footer>

    <p class="copyright">
        © 2026 Wanderlust. All Rights Reserved.
    </p>

</footer>


</body>
</html>
